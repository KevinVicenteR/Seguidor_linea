; ATLAS Rev. 1.4 - firmware orientado a objetos
;
;   Compilar:            pio run -e atlas
;   Subir (USBasp/ICSP): pio run -e atlas -t upload
;   Subir por UART:      pio run -e atlas_uart -t upload
;
; El simulador y las pruebas unitarias se construyen con CMake
; (ver CMakeLists.txt en la raíz).

[platformio]
src_dir = firmware/programa
lib_dir = firmware/bibliotecas
default_envs = atlas

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags = -Wall -Wextra -std=gnu++14
  ; La red jerárquica quedó neutra (rama feature/red-jerarquica): fuera del firmware.
  -DATLAS_NO_HIERARCHY
  -DATLAS_NO_TRAINING_HOOKS
  -Ifirmware/bibliotecas/AtlasCore/src/app
  -Ifirmware/bibliotecas/AtlasCore/src/configuracion
  -Ifirmware/bibliotecas/AtlasCore/src/sensores
  -Ifirmware/bibliotecas/AtlasCore/src/control
  -Ifirmware/bibliotecas/AtlasCore/src/planificador
  -Ifirmware/bibliotecas/AtlasCore/src/memoria
  -Ifirmware/bibliotecas/AtlasCore/src/registro
  -Ifirmware/bibliotecas/AtlasCore/src/red_neuronal
build_unflags = -std=gnu++11
lib_ldf_mode = chain+

; Programación por ICSP con USBasp (método indicado en el manual).
[env:atlas]
upload_protocol = usbasp
upload_flags = -e

;Igual que atlas, más el registro de la carrera por serial (AvrRaceLogger.h):
;   pio run -e atlas_log -t upload
;   python3 diagnostico/capture_log.py /dev/cu.usbserial-XXXX vuelta.bin
[env:atlas_log]
upload_protocol = usbasp
upload_flags = -e
build_flags = ${env.build_flags} -DATLAS_LOG

; Programación por la terminal UART (convertidor USB-TTL con bootloader).
[env:atlas_uart]
upload_protocol = arduino
monitor_speed = 115200
