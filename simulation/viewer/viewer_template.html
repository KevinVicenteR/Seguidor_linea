<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador ATLAS</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #eef0f3;
    --text: #1b1e24;
    --muted: #5f6672;
    --border: #d9dde3;
    --accent: #2f6fde;
    --ok: #1f8a4c;
    --ok-bg: #e3f4ea;
    --fail: #c43c32;
    --fail-bg: #fbe7e5;
    --warn: #a86b00;
    --warn-bg: #fdf1d8;
    --track-surface: #16181d;
    --track-line: #eceff3;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216;
      --panel: #181b21;
      --panel-2: #20242b;
      --text: #e7e9ee;
      --muted: #9aa1ad;
      --border: #2c313a;
      --accent: #6b9cff;
      --ok: #4cc283;
      --ok-bg: #173225;
      --fail: #ff7a6e;
      --fail-bg: #3a1c1a;
      --warn: #f0b546;
      --warn-bg: #3a2d12;
      --track-surface: #0b0c0f;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101216; --panel: #181b21; --panel-2: #20242b; --text: #e7e9ee; --muted: #9aa1ad; --border: #2c313a;
    --accent: #6b9cff; --ok: #4cc283; --ok-bg: #173225; --fail: #ff7a6e; --fail-bg: #3a1c1a; --warn: #f0b546;
    --warn-bg: #3a2d12; --track-surface: #0b0c0f; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .totals { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--panel-2); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.fail { background: var(--fail-bg); color: var(--fail); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; padding: 16px 20px; }
  aside, section.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  aside { padding: 10px; max-height: calc(100vh - 110px); overflow: auto; position: sticky; top: 16px; }
  aside .filters { display: flex; gap: 6px; margin: 2px 2px 10px; }
  aside .filters button { flex: 1; }
  .group-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    margin: 12px 6px 4px; }
  .scenario { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
    color: inherit; font: inherit; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .scenario:hover { background: var(--panel-2); }
  .scenario.active { background: var(--accent); color: #fff; }
  .scenario .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.fail { background: var(--fail); } .dot.warn { background: var(--warn); }
  .scenario .meta { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; font-size: 12px; }
  .stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { padding: 14px 16px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .desc { color: var(--muted); margin: 0 0 10px; }
  .canvas-wrap { position: relative; border-radius: 8px; overflow: hidden; background: var(--track-surface); }
  canvas#track { display: block; width: 100%; height: min(62vh, 620px); }
  .legend { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 10px; align-items: center; color: #d6dae1;
    font-size: 12px; background: rgba(0, 0, 0, .45); padding: 5px 9px; border-radius: 6px; }
  .legend .bar { width: 120px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #3b82f6, #22c55e, #eab308, #ef4444); }
  .hud { position: absolute; right: 10px; top: 10px; color: #e9ecf1; font: 600 13px/1.35 ui-monospace, Menlo, monospace;
    background: rgba(0, 0, 0, .5); padding: 7px 10px; border-radius: 6px; text-align: right; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; }
  .controls input[type=range] { flex: 1 1 240px; accent-color: var(--accent); }
  button, select { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; min-width: 92px; }
  button.on { outline: 2px solid var(--accent); outline-offset: -2px; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 120px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .metric { background: var(--panel-2); border-radius: 8px; padding: 9px 11px; }
  .metric .label { color: var(--muted); font-size: 12px; }
  .metric .value { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .status { padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; font-weight: 600; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.fail { background: var(--fail-bg); color: var(--fail); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  canvas#chart { display: block; width: 100%; height: 150px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: center; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td.cell { cursor: pointer; border-radius: 6px; }
  td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.cell.ok { color: var(--ok); } td.cell.fail { color: var(--fail); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; padding: 12px 16px; }
    aside { position: static; max-height: 280px; }
    canvas#track { height: 58vh; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Simulador ATLAS · firmware POO</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="totals" id="totals"></div>
</header>

<main>
  <aside>
    <div class="filters">
      <button id="filterAll" class="on">Todos</button>
      <button id="filterFail">Solo fallas</button>
    </div>
    <div id="list"></div>
  </aside>

  <div class="stage">
    <section class="card">
      <h2 id="title"></h2>
      <p class="desc" id="description"></p>
      <div id="status" class="status"></div>
      <div class="canvas-wrap">
        <canvas id="track"></canvas>
        <div class="hud" id="hud"></div>
        <div class="legend"><span>lento</span><span class="bar"></span><span>rápido</span></div>
      </div>
      <div class="controls">
        <button class="primary" id="play">▶ Reproducir</button>
        <button id="restart" title="Reiniciar">⟲</button>
        <select id="rate" title="Velocidad de reproducción">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
        <button id="follow" title="La cámara sigue al robot">🎥 Seguir robot</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Línea de tiempo">
        <span class="time" id="time"></span>
      </div>
      <canvas id="chart"></canvas>
    </section>

    <section class="card">
      <div class="metrics" id="metrics"></div>
    </section>

    <section class="card">
      <h2>Matriz de resultados</h2>
      <p class="desc">Tiempo de carrera por pista y velocidad (PWM). Haz clic en una celda para verla.</p>
      <div class="table-wrap"><table id="matrix"></table></div>
      <p class="note" id="configNote"></p>
    </section>
  </div>
</main>

<script>
const DATA = /*__SIM_DATA__*/null;

const $ = (id) => document.getElementById(id);
const state = { index: 0, time: 0, playing: false, rate: 1, follow: false, onlyFailures: false, lastFrame: 0 };

const fmt = (value, digits = 2) => Number(value).toFixed(digits);
const statusOf = (s) => s.passed ? 'ok' : (s.required ? 'fail' : 'warn');
const statusText = (s) => s.passed ? 'Completó' : (s.required ? 'Falló' : 'Falló (extremo)');

//  ----- Resumen y lista ------------------------------------------------------

function renderHeader() {
  const total = DATA.scenarios.length;
  const passed = DATA.scenarios.filter((s) => s.passed).length;
  const requiredFails = DATA.scenarios.filter((s) => !s.passed && s.required).length;
  const stressFails = DATA.scenarios.filter((s) => !s.passed && !s.required).length;
  const meters = DATA.tracks.reduce((sum, t) => sum + t.length, 0);
  $('subtitle').textContent = `${DATA.tracks.length} pistas · ${fmt(meters, 0)} m de línea · ${total} escenarios`;
  $('totals').innerHTML =
    `<span class="pill ok">${passed} completados</span>` +
    `<span class="pill ${requiredFails ? 'fail' : ''}">${requiredFails} fallas obligatorias</span>` +
    (stressFails ? `<span class="pill warn">${stressFails} fallas extremas</span>` : '');
}

function renderList() {
  const list = $('list');
  list.innerHTML = '';
  DATA.tracks.forEach((track, trackIndex) => {
    const items = DATA.scenarios
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => s.track === trackIndex && (!state.onlyFailures || !s.passed));
    if (!items.length) return;
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = `${track.name} · ${fmt(track.length, 1)} m`;
    list.appendChild(title);
    items.forEach(({ s, i }) => {
      const button = document.createElement('button');
      button.className = 'scenario' + (i === state.index ? ' active' : '');
      const variant = s.label.split(' · ').slice(1).join(' · ');
      button.innerHTML = `<span class="dot ${statusOf(s)}"></span><span>${variant}</span>` +
        `<span class="meta">${s.passed ? fmt(s.raceTime, 1) + ' s' : '—'}</span>`;
      button.onclick = () => select(i);
      list.appendChild(button);
    });
  });
}

function renderMatrix() {
  const speeds = [...new Set(DATA.scenarios.filter((s) => s.label.split(' · ').length === 2 ||
    s.label.endsWith('(extremo)')).map((s) => s.pwm))].sort((a, b) => a - b);
  let html = '<tr><th>Pista</th><th>Largo</th><th>Radio mín.</th>' +
    speeds.map((p) => `<th>PWM ${p}${p > 220 ? ' *' : ''}</th>`).join('') + '</tr>';
  DATA.tracks.forEach((track, t) => {
    html += `<tr><td>${track.name}</td><td>${fmt(track.length, 1)} m</td><td>${track.minRadius < 0.04 ? 'esquina viva' : fmt(track.minRadius * 100, 0) + ' cm'}</td>`;
    speeds.forEach((pwm) => {
      const i = DATA.scenarios.findIndex((s) => s.track === t && s.pwm === pwm &&
        (s.label.split(' · ').length === 2 || s.label.endsWith('(extremo)')));
      if (i < 0) { html += '<td>—</td>'; return; }
      const s = DATA.scenarios[i];
      html += `<td class="cell ${s.passed ? 'ok' : 'fail'}" data-i="${i}">${s.passed ? fmt(s.raceTime, 2) + ' s' : '✗ ' + (s.failure || 'falla')}</td>`;
    });
    html += '</tr>';
  });
  $('matrix').innerHTML = html;
  $('matrix').querySelectorAll('td.cell').forEach((cell) => cell.onclick = () => {
    select(Number(cell.dataset.i));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  const c = DATA.config;
  $('configNote').textContent = `Criterio: completar cada pista en menos de 40 s. * Prueba extrema (PWM máximo del firmware). Firmware: Kp ${c.kp}, Kd ${c.kd}, ` +
    `lazo ${c.loopPeriodUs} µs. Robot: ${c.sensorCount} sensores cada ${c.sensorPitch * 1000} mm, barra a ` +
    `${c.sensorBarAhead * 100} cm del eje, ${c.maxWheelSpeed} m/s a PWM 255.`;
}

//  ----- Selección y métricas -------------------------------------------------

function current() { return DATA.scenarios[state.index]; }
function duration() { const t = current().t; return t.length ? t[t.length - 1] / 1000 : 0; }

function select(index) {
  state.index = index;
  state.time = 0;
  state.playing = true;
  const s = current();
  const track = DATA.tracks[s.track];
  $('title').textContent = s.label;
  $('description').textContent = `${track.description} Largo ${fmt(track.length, 1)} m · ${track.laps} vuelta(s) · línea ${s.lineColor}.`;
  const status = $('status');
  status.className = 'status ' + statusOf(s);
  status.textContent = s.passed
    ? `✓ Completó ${track.laps} vuelta(s) en ${fmt(s.raceTime, 2)} s y se detuvo correctamente.`
    : `✗ ${statusText(s)}: ${s.failure || 'no se detuvo correctamente'} a los ${fmt(s.raceTime, 2)} s (${fmt(s.distance, 1)} m recorridos).`;
  renderMetrics(s);
  renderList();
  prepareTrackPath();
  updatePlayButton();
}

function renderMetrics(s) {
  const laps = s.lapTimes.length ? s.lapTimes.map((l) => fmt(l, 2) + ' s').join(' / ') : '—';
  const items = [
    ['Tiempo de carrera', fmt(s.raceTime, 2) + ' s'],
    ['Vueltas', laps],
    ['Velocidad media (pista)', fmt(s.avgSpeed, 2) + ' m/s'],
    ['Velocidad máxima', fmt(s.maxSpeed, 2) + ' m/s'],
    ['Error lateral RMS', fmt(s.rmsOffsetMm, 1) + ' mm'],
    ['Error lateral máx.', fmt(s.maxOffsetMm, 0) + ' mm'],
    ['Sin línea (recuperación)', fmt(s.lostLinePct, 1) + ' %'],
    ['Derrape', fmt(s.slidingPct, 1) + ' %'],
    ['Oscilación (cruces/m)', fmt(s.zigzagPerMeter, 2)],
    ['Esfuerzo de dirección', fmt(s.steeringRms, 0) + ' PWM'],
    ['Sensores calibrados', `${s.calibratedSensors}/16`],
    ['PWM crucero / impeller', `${s.pwm} / ${s.impeller}`],
  ];
  $('metrics').innerHTML = items.map(([label, value]) =>
    `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('');
}

//  ----- Dibujo ---------------------------------------------------------------

const canvas = $('track');
const ctx = canvas.getContext('2d');
const chart = $('chart');
const chartCtx = chart.getContext('2d');
let trackPath = null;
let trackBounds = null;

// Los huecos (painted = 0) se dejan sin dibujar.
function prepareTrackPath() {
  const track = DATA.tracks[current().track];
  const pts = track.points, painted = track.painted;
  const count = pts.length / 2;
  trackPath = new Path2D();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let drawing = false;
  for (let k = 0; k <= count; k++) {
    const i = k % count;
    const x = pts[2 * i] / 1000, y = pts[2 * i + 1] / 1000;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    const prev = (i + count - 1) % count;
    if (!painted[prev] || !painted[i] && !drawing) { drawing = false; }
    if (painted[prev] && (k > 0)) {
      if (!drawing) { trackPath.moveTo(pts[2 * prev] / 1000, pts[2 * prev + 1] / 1000); drawing = true; }
      trackPath.lineTo(x, y);
    }
    if (!painted[i]) drawing = false;
  }
  trackBounds = { minX, minY, maxX, maxY };
}

function resizeCanvas(c) {
  const ratio = window.devicePixelRatio || 1;
  const w = Math.round(c.clientWidth * ratio), h = Math.round(c.clientHeight * ratio);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return ratio;
}

function speedColor(v, vmax) {
  const stops = [[59, 130, 246], [34, 197, 94], [234, 179, 8], [239, 68, 68]];
  const u = Math.max(0, Math.min(0.999, v / Math.max(vmax, 0.1))) * (stops.length - 1);
  const k = Math.floor(u), f = u - k, a = stops[k], b = stops[k + 1];
  return `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * f)).join(',')})`;
}

function sampleIndexAt(time) {
  const t = current().t, target = time * 1000;
  let lo = 0, hi = t.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (t[mid] <= target) lo = mid; else hi = mid - 1; }
  return lo;
}

function poseAt(time) {
  const s = current();
  const i = sampleIndexAt(time), j = Math.min(i + 1, s.t.length - 1);
  const span = s.t[j] - s.t[i];
  const f = span > 0 ? Math.min(1, Math.max(0, (time * 1000 - s.t[i]) / span)) : 0;
  let dh = (s.h[j] - s.h[i]) / 1000;
  while (dh > Math.PI) dh -= 2 * Math.PI;
  while (dh < -Math.PI) dh += 2 * Math.PI;
  return {
    i,
    x: (s.x[i] + (s.x[j] - s.x[i]) * f) / 1000,
    y: (s.y[i] + (s.y[j] - s.y[i]) * f) / 1000,
    heading: s.h[i] / 1000 + dh * f,
    speed: (s.v[i] + (s.v[j] - s.v[i]) * f) / 100,
    trackable: (s.f[i] & 1) === 1,
    sliding: (s.f[i] & 2) === 2,
    offset: s.o[i],
  };
}

function viewTransform(width, height, pose) {
  if (state.follow) {
    const viewMeters = 1.6;
    const scale = Math.min(width, height) / viewMeters;
    return { scale, ox: width / 2 - pose.x * scale, oy: height / 2 + pose.y * scale };
  }
  const margin = 0.35;
  const w = trackBounds.maxX - trackBounds.minX + 2 * margin;
  const h = trackBounds.maxY - trackBounds.minY + 2 * margin;
  const scale = Math.min(width / w, height / h);
  const ox = (width - (trackBounds.maxX + trackBounds.minX) * scale) / 2;
  const oy = (height + (trackBounds.maxY + trackBounds.minY) * scale) / 2;
  return { scale, ox, oy };
}

function drawRobot(pose, scale) {
  const c = DATA.config;
  ctx.save();
  ctx.translate(pose.x, pose.y);
  ctx.rotate(pose.heading);
  const px = 1 / scale;
  // chasis
  ctx.fillStyle = 'rgba(70, 120, 230, 0.85)';
  ctx.strokeStyle = '#d7e3ff';
  ctx.lineWidth = 1.5 * px;
  ctx.beginPath();
  ctx.moveTo(-0.045, -0.07); ctx.lineTo(0.06, -0.05); ctx.lineTo(c.sensorBarAhead - 0.01, -0.02);
  ctx.lineTo(c.sensorBarAhead - 0.01, 0.02); ctx.lineTo(0.06, 0.05); ctx.lineTo(-0.045, 0.07); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // ruedas
  ctx.fillStyle = '#111';
  const half = c.wheelBase / 2;
  ctx.fillRect(-0.022, half - 0.006, 0.044, 0.014);
  ctx.fillRect(-0.022, -half - 0.008, 0.044, 0.014);
  // barra de sensores
  const barHalf = (c.sensorCount - 1) / 2 * c.sensorPitch;
  ctx.fillStyle = pose.trackable ? '#22c55e' : '#ef4444';
  ctx.fillRect(c.sensorBarAhead - 0.006, -barHalf - 0.006, 0.012, 2 * barHalf + 0.012);
  ctx.fillStyle = '#fff';
  for (let k = 0; k < c.sensorCount; k++) {
    ctx.beginPath();
    ctx.arc(c.sensorBarAhead, -barHalf + k * c.sensorPitch, 0.0022, 0, 2 * Math.PI);
    ctx.fill();
  }
  if (pose.sliding) {
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 3 * px;
    ctx.beginPath(); ctx.arc(0.06, 0, 0.16, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  const s = current();
  const ratio = resizeCanvas(canvas);
  const width = canvas.width, height = canvas.height;
  const pose = poseAt(state.time);
  const view = viewTransform(width, height, pose);
  const styles = getComputedStyle(document.documentElement);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = s.lineColor === 'negra' ? '#f3f4f6' : styles.getPropertyValue('--track-surface');
  ctx.fillRect(0, 0, width, height);

  ctx.setTransform(view.scale, 0, 0, -view.scale, view.ox, view.oy);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = s.lineColor === 'negra' ? '#14161a' : '#eceff3';
  ctx.lineWidth = DATA.tracks[s.track].lineWidth;
  ctx.stroke(trackPath);

  // estela coloreada por velocidad
  const vmax = Math.max(...s.v) / 100;
  ctx.lineWidth = Math.max(0.006, 2.2 / view.scale);
  for (let k = 1; k <= pose.i; k++) {
    ctx.strokeStyle = speedColor(s.v[k] / 100, vmax);
    ctx.beginPath();
    ctx.moveTo(s.x[k - 1] / 1000, s.y[k - 1] / 1000);
    ctx.lineTo(s.x[k] / 1000, s.y[k] / 1000);
    ctx.stroke();
  }
  drawRobot(pose, view.scale);

  $('hud').innerHTML = `t ${fmt(state.time, 2)} s<br>${fmt(pose.speed, 2)} m/s<br>error ${pose.offset} mm` +
    (pose.trackable ? '' : '<br><span style="color:#ff8a80">buscando línea</span>') +
    (pose.sliding ? '<br><span style="color:#facc15">derrapando</span>' : '');
  $('time').textContent = `${fmt(state.time, 2)} / ${fmt(duration(), 2)} s`;
  $('scrub').value = duration() ? Math.round(1000 * state.time / duration()) : 0;
  drawChart(pose.i, ratio);
}

function drawChart(cursor, ratio) {
  const s = current();
  resizeCanvas(chart);
  const w = chart.width, h = chart.height, pad = 24 * ratio;
  const styles = getComputedStyle(document.documentElement);
  chartCtx.setTransform(1, 0, 0, 1, 0, 0);
  chartCtx.clearRect(0, 0, w, h);
  if (!s.t.length) return;
  const tmax = s.t[s.t.length - 1] || 1;
  const vmax = Math.max(...s.v) / 100 || 1;
  const X = (t) => pad + (w - 2 * pad) * t / tmax;
  const Y = (v) => h - pad - (h - 2 * pad) * v / (vmax * 1.1);

  chartCtx.fillStyle = styles.getPropertyValue('--muted');
  chartCtx.font = `${11 * ratio}px system-ui`;
  chartCtx.fillText(`velocidad (m/s) · máx ${fmt(vmax, 2)}`, pad, 14 * ratio);
  chartCtx.strokeStyle = styles.getPropertyValue('--border');
  chartCtx.beginPath(); chartCtx.moveTo(pad, h - pad); chartCtx.lineTo(w - pad, h - pad); chartCtx.stroke();

  // zonas sin línea
  chartCtx.fillStyle = 'rgba(239, 68, 68, 0.18)';
  for (let k = 0; k < s.t.length; k++) {
    if (s.f[k] & 1) continue;
    const x0 = X(s.t[k]), x1 = X(s.t[Math.min(k + 1, s.t.length - 1)]);
    chartCtx.fillRect(x0, pad, Math.max(1, x1 - x0), h - 2 * pad);
  }
  chartCtx.strokeStyle = styles.getPropertyValue('--accent');
  chartCtx.lineWidth = 1.5 * ratio;
  chartCtx.beginPath();
  for (let k = 0; k < s.t.length; k++) {
    const x = X(s.t[k]), y = Y(s.v[k] / 100);
    if (k === 0) chartCtx.moveTo(x, y); else chartCtx.lineTo(x, y);
  }
  chartCtx.stroke();
  chartCtx.strokeStyle = styles.getPropertyValue('--text');
  chartCtx.beginPath(); chartCtx.moveTo(X(s.t[cursor]), pad); chartCtx.lineTo(X(s.t[cursor]), h - pad); chartCtx.stroke();
  chartCtx.fillStyle = styles.getPropertyValue('--muted');
  chartCtx.fillText('zonas rojas = robot buscando la línea', w - pad - 220 * ratio, 14 * ratio);
}

//  ----- Reproducción ---------------------------------------------------------

function updatePlayButton() { $('play').textContent = state.playing ? '❚❚ Pausa' : '▶ Reproducir'; }

function frame(now) {
  const dt = state.lastFrame ? (now - state.lastFrame) / 1000 : 0;
  state.lastFrame = now;
  if (state.playing) {
    state.time += dt * state.rate;
    if (state.time >= duration()) { state.time = duration(); state.playing = false; updatePlayButton(); }
  }
  draw();
  requestAnimationFrame(frame);
}

$('play').onclick = () => {
  if (state.time >= duration()) state.time = 0;
  state.playing = !state.playing;
  updatePlayButton();
};
$('restart').onclick = () => { state.time = 0; state.playing = true; updatePlayButton(); };
$('rate').onchange = (e) => { state.rate = Number(e.target.value); };
$('follow').onclick = () => { state.follow = !state.follow; $('follow').classList.toggle('on', state.follow); };
$('scrub').oninput = (e) => { state.time = duration() * Number(e.target.value) / 1000; };
$('filterAll').onclick = () => { state.onlyFailures = false; $('filterAll').classList.add('on'); $('filterFail').classList.remove('on'); renderList(); };
$('filterFail').onclick = () => { state.onlyFailures = true; $('filterFail').classList.add('on'); $('filterAll').classList.remove('on'); renderList(); };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.key === 'f') $('follow').click();
});

renderHeader();
renderMatrix();
const firstFailure = DATA.scenarios.findIndex((s) => !s.passed && s.required);
select(Math.max(0, DATA.scenarios.findIndex((s) => s.track === 0 && s.pwm === 190)));
if (firstFailure >= 0) state.playing = true;
requestAnimationFrame(frame);
</script>
</body>
